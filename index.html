<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>FR Blanzat Basket - inscriptions</title>
<style>
@font-face{font-family:'Barlow';font-weight:400;font-display:swap;src:url('fonts/barlow-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-weight:500;font-display:swap;src:url('fonts/barlow-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-weight:600;font-display:swap;src:url('fonts/barlow-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:600;font-display:swap;src:url('fonts/barlow-condensed-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-display:swap;src:url('fonts/barlow-condensed-latin-700-normal.woff2') format('woff2')}
/* Page mobile : bandeau du club, champ « votre nom » fixe en haut, cartes de matchs avec un bouton par rôle libre */
:root{
  --bg:#f3f5f8; --surface:#fff; --surface-2:#eef1f5; --line:#d9dee6; --fg:#141a24; --muted:#5a6476;
  --accent:#d4561c; --accent-ink:#fff; --accent-soft:#fbe7dc; --ok:#17734a; --ok-soft:#dff1e7; --bad:#b3261e; --bad-soft:#f9e1df;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1218; --surface:#161b24; --surface-2:#1d2430; --line:#2b3342; --fg:#e7eaf0; --muted:#97a1b3;
  --accent-soft:#3a2418; --ok:#4fc68a; --ok-soft:#16301f; --bad:#f08077; --bad-soft:#3a1714; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{background:var(--accent);color:var(--accent-ink);padding-top:env(safe-area-inset-top,0px)}
header .wrap{padding-block:18px 16px;display:grid;gap:2px}
header .club{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
header h1{font-size:28px;line-height:1.1}
.nom-bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.05)}
.nom-bar .wrap{padding-block:10px;display:grid;gap:4px}
.nom-bar label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.nom-bar input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:17px}
.nom-bar input:focus{border-color:var(--accent)}
.nom-bar.vide input{border-color:var(--accent);background:var(--accent-soft)}
main{padding-block:16px 40px;display:grid;gap:14px}
.intro{color:var(--muted);font-size:14px;margin:0}
.jour{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 2px -4px}
.carte{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.entete{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.heure{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.affiche b{display:block;font-size:16px}
.affiche span{display:block;font-size:13.5px;color:var(--muted)}
.roles{display:grid;gap:6px}
.role{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.role .lib{font-size:14px;font-weight:600}
.role .lib small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.role.pris .lib small{color:var(--fg);font-size:14px}
.role.moi{background:var(--ok-soft)}
.role.moi .lib small{color:var(--ok);font-weight:600}
.btn{border:0;border-radius:9px;padding:9px 13px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);white-space:nowrap;font-size:14.5px}
.btn.confirmer{background:var(--ok);color:#fff}
.btn:disabled{opacity:.5}
.etat{border:1.5px dashed var(--line);border-radius:14px;padding:26px 18px;text-align:center;display:grid;gap:8px;background:var(--surface)}
.etat p{margin:0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:500;max-width:calc(100vw - 32px);box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:20}
.toast.err{background:var(--bad);color:#fff}
.pied{font-size:12.5px;color:var(--muted);text-align:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap"><span class="club" id="club">Inscriptions</span><h1 id="titre">Officiels et bénévoles</h1></div></header>
<div class="nom-bar" id="nomBar"><div class="wrap">
  <label for="nom">Votre prénom et nom (retenu sur ce téléphone)</label>
  <input id="nom" type="text" autocomplete="name" placeholder="ex. Julie Martin" maxlength="60">
</div></div>
<main class="wrap" id="main"><div class="etat"><h2>Chargement…</h2></div></main>
<div class="toast" id="toast" hidden></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const h = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"], MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const params = new URLSearchParams(location.hash.slice(1));
const REF = params.get("p") || "", KEY = params.get("k") || "", TOKEN = params.get("t") || "";
const URL_BASE = /^[a-z0-9]{8,40}$/.test(REF) ? `https://${REF}.supabase.co` : "";
let data = null, armed = null, toastT;
const store = { get(k){ try { return localStorage.getItem(k) || ""; } catch { return ""; } }, set(k, v){ try { localStorage.setItem(k, v); } catch {} } };

function toast(msg, err){ const t = $("#toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3500); }
function jour(ds){ const [y,m,d] = (ds||"").split("-").map(Number); if (!y) return "Date à fixer"; const x = new Date(y, m-1, d); return `${JOURS[x.getDay()]} ${d === 1 ? "1er" : d} ${MOIS[m-1]}`; }
function heure(t){ const m = /^(\d{1,2}):(\d{2})/.exec(t||""); return m ? `${+m[1]}h${m[2]}` : "—"; }
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();

async function rpc(fn, body){
  const headers = { "apikey":KEY, "Content-Type":"application/json" };
  if (KEY.startsWith("eyJ")) headers.Authorization = "Bearer " + KEY;
  const r = await fetch(`${URL_BASE}/rest/v1/rpc/${fn}`, { method:"POST", headers, body:JSON.stringify(body) });
  if (!r.ok) throw new Error("Le serveur n'a pas répondu (" + r.status + ").");
  return r.json();
}
async function charger(){
  if (!URL_BASE || !KEY || !TOKEN){ etat("Lien incomplet", "Ouvrez le lien complet reçu sur WhatsApp, sans le couper."); return; }
  try {
    const r = await rpc("partage_lire", { p_token:TOKEN });
    if (!r.ok){ etat("Lien expiré ou désactivé", "Demandez un nouveau lien à l'entraîneur ou au club."); return; }
    data = r; rendre();
  } catch (e){ if (!data) etat("Connexion impossible", "Vérifiez votre connexion internet puis rechargez la page."); }
}
function etat(t, p){ $("#main").innerHTML = `<div class="etat"><h2>${h(t)}</h2><p>${h(p)}</p></div>`; $("#nomBar").hidden = true; }
function rendre(){
  $("#nomBar").hidden = false;
  $("#club").textContent = data.club || "Inscriptions";
  $("#titre").textContent = data.titre || "Officiels et bénévoles";
  document.title = `${data.titre || "Inscriptions"} - ${data.club || ""}`;
  const moi = norm($("#nom").value);
  const cols = data.colonnes || [];
  let html = `<p class="intro">Choisissez un rôle libre et appuyez sur <b>Je m'inscris</b>, puis confirmez. Une fois inscrit, seul le club peut modifier ou annuler : prévenez l'entraîneur en cas d'empêchement.</p>`;
  if (!data.matchs.length) html += `<div class="etat"><h2>Aucun match à venir</h2><p>Les prochains matchs à domicile apparaîtront ici.</p></div>`;
  let dernier = "";
  for (const m of data.matchs){
    if (m.date !== dernier){ dernier = m.date; html += `<div class="jour">${h(jour(m.date))}</div>`; }
    const libres = cols.filter(c => !(m.valeurs || {})[c.k]).length;
    html += `<section class="carte"><div class="entete"><span class="heure">${h(heure(m.heure))}</span><div class="affiche"><b>${h(m.equipe)}${m.club_equipe ? " · " + h(m.club_equipe) : ""} reçoit ${h(m.adversaire || "?")}</b><span>${h(m.salle || "Salle à préciser")} · ${libres ? `${libres} rôle${libres > 1 ? "s" : ""} libre${libres > 1 ? "s" : ""}` : "complet"}</span></div></div>
      <div class="roles">${cols.map(c => {
        const v = (m.valeurs || {})[c.k];
        if (v) return `<div class="role pris ${moi && norm(v).includes(moi) ? "moi" : ""}"><span class="lib">${h(c.l)}<small>${h(v)}</small></span><span></span></div>`;
        const cle = m.id + "|" + c.k, ok = armed === cle;
        return `<div class="role"><span class="lib">${h(c.l)}<small>${c.req ? "À pourvoir" : "Libre"}</small></span><button class="btn ${ok ? "confirmer" : ""}" data-m="${h(m.id)}" data-k="${h(c.k)}">${ok ? "Confirmer" : "Je m'inscris"}</button></div>`;
      }).join("")}</div></section>`;
  }
  if (data.expire_le) html += `<p class="pied">Lien valable jusqu'au ${h(jour(String(data.expire_le).slice(0, 10)))}.</p>`;
  $("#main").innerHTML = html;
}
document.addEventListener("click", async e => {
  const b = e.target.closest("button[data-m]"); if (!b) return;
  const nom = $("#nom").value.trim();
  if (nom.length < 2){ $("#nomBar").classList.add("vide"); $("#nom").focus(); toast("Indiquez d'abord votre prénom et nom, en haut de la page.", true); return; }
  const cle = b.dataset.m + "|" + b.dataset.k;
  if (armed !== cle){ armed = cle; rendre(); return; }
  b.disabled = true;
  try {
    const r = await rpc("partage_ecrire", { p_token:TOKEN, p_match:b.dataset.m, p_champ:b.dataset.k, p_valeur:nom });
    armed = null;
    if (r.ok) toast("C'est noté, merci !");
    else toast(r.raison === "deja_pris" ? "Quelqu'un vient de prendre ce rôle." : r.raison === "lien_invalide" ? "Ce lien n'est plus valable." : "Inscription refusée.", true);
  } catch (err){ toast(err.message, true); }
  await charger();
});
$("#nom").value = store.get("pb-nom");
$("#nom").addEventListener("input", e => { store.set("pb-nom", e.target.value.trim()); $("#nomBar").classList.remove("vide"); if (data) rendre(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) charger(); });
setInterval(() => { if (!document.hidden && !armed) charger(); }, 30000);
charger();
</script>
</body>
</html>
