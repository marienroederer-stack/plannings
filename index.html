<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>FR Blanzat Basket - inscriptions</title>
<meta name="description" content="Arbitres, table de marque, buvette… Choisissez un créneau libre en un clic.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="FR Blanzat Basket">
<meta property="og:title" content="Inscriptions officiels & bénévoles">
<meta property="og:description" content="Arbitres, table de marque, buvette… Choisissez un créneau libre en un clic.">
<meta property="og:image" content="https://marienroederer-stack.github.io/plannings/apercu.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
@font-face{font-family:'Barlow';font-weight:400;font-display:swap;src:url('fonts/barlow-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-weight:500;font-display:swap;src:url('fonts/barlow-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-weight:600;font-display:swap;src:url('fonts/barlow-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:600;font-display:swap;src:url('fonts/barlow-condensed-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-display:swap;src:url('fonts/barlow-condensed-latin-700-normal.woff2') format('woff2')}
/* Page mobile : bandeau du club, champ « votre nom » fixe en haut, cartes de matchs avec un bouton par rôle libre */
:root{
  --bg:#f3f5f8; --surface:#fff; --surface-2:#eef1f5; --line:#d9dee6; --fg:#141a24; --muted:#5a6476;
  --accent:#d4561c; --accent-ink:#fff; --accent-soft:#fbe7dc; --ok:#17734a; --ok-soft:#dff1e7; --bad:#b3261e; --bad-soft:#f9e1df;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1218; --surface:#161b24; --surface-2:#1d2430; --line:#2b3342; --fg:#e7eaf0; --muted:#97a1b3;
  --accent-soft:#3a2418; --ok:#4fc68a; --ok-soft:#16301f; --bad:#f08077; --bad-soft:#3a1714; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{background:var(--accent);color:var(--accent-ink);padding-top:env(safe-area-inset-top,0px)}
header .wrap{padding-block:18px 16px;display:grid;gap:2px}
header .club{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
header h1{font-size:28px;line-height:1.1}
.saisie{grid-column:1 / -1;display:grid;gap:8px;padding-top:4px}
.saisie label{font-size:12.5px;font-weight:600;color:var(--muted)}
.saisie input{width:100%;border:1.5px solid var(--accent);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:17px}
.saisie .actions{display:flex;gap:8px}
.saisie .actions .btn{flex:1}
.btn.annuler{background:transparent;color:var(--muted);border:1px solid var(--line)}
.role.ouvert{background:var(--accent-soft)}
main{padding-block:16px 40px;display:grid;gap:14px}
.intro{color:var(--muted);font-size:14px;margin:0}
.jour{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 2px -4px}
.jour-arb{display:grid;gap:8px;margin:10px 0 -2px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px dashed var(--line)}
.jour-arb .haut{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.jour-arb .haut .jour{margin:0;flex:1;min-width:140px}
.btn.indispo{background:transparent;color:var(--bad);border:1.5px solid var(--bad);padding:7px 11px;font-size:13.5px}
.indispos{font-size:13.5px;color:var(--muted)}
.indispos b{color:var(--fg);font-weight:600}
.indispos .moi{color:var(--bad)}
.jour-arb form{display:grid;gap:8px}
.carte{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.entete{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.heure{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.affiche b{display:block;font-size:16px}
.affiche span{display:block;font-size:13.5px;color:var(--muted)}
.roles{display:grid;gap:6px}
.role{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.role .lib{font-size:14px;font-weight:600}
.role .lib small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.role.pris .lib small{color:var(--fg);font-size:14px}
.role.moi{background:var(--ok-soft)}
.role.moi .lib small{color:var(--ok);font-weight:600}
.btn{border:0;border-radius:9px;padding:9px 13px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);white-space:nowrap;font-size:14.5px}
.btn.confirmer{background:var(--ok);color:#fff}
.btn:disabled{opacity:.5}
.etat{border:1.5px dashed var(--line);border-radius:14px;padding:26px 18px;text-align:center;display:grid;gap:8px;background:var(--surface)}
.etat p{margin:0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:500;max-width:calc(100vw - 32px);box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:20}
.toast.err{background:var(--bad);color:#fff}
.pied{font-size:12.5px;color:var(--muted);text-align:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap"><span class="club" id="club">Inscriptions</span><h1 id="titre">Officiels et bénévoles</h1></div></header>
<main class="wrap" id="main"><div class="etat"><h2>Chargement…</h2></div></main>
<div class="toast" id="toast" hidden></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const h = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"], MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const params = new URLSearchParams(location.hash.slice(1));
// Lien court (#t=…) : adresse et clé publique de la base lues dans config.json ; lien long (#p=…&k=…&t=…) accepté aussi
let REF = params.get("p") || "", KEY = params.get("k") || "", URL_BASE = "";
const TOKEN = params.get("t") || "";
let data = null, ouvert = null, toastT;
const inscrits = new Set();   // noms inscrits depuis ce téléphone (mis en évidence)
const store = { get(k){ try { return localStorage.getItem(k) || ""; } catch { return ""; } }, set(k, v){ try { localStorage.setItem(k, v); } catch {} } };

function toast(msg, err){ const t = $("#toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3500); }
function jour(ds){ const [y,m,d] = (ds||"").split("-").map(Number); if (!y) return "Date à fixer"; const x = new Date(y, m-1, d); return `${JOURS[x.getDay()]} ${d === 1 ? "1er" : d} ${MOIS[m-1]}`; }
function heure(t){ const m = /^(\d{1,2}):(\d{2})/.exec(t||""); return m ? `${+m[1]}h${m[2]}` : "—"; }
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();

async function rpc(fn, body){
  const headers = { "apikey":KEY, "Content-Type":"application/json" };
  if (KEY.startsWith("eyJ")) headers.Authorization = "Bearer " + KEY;
  const r = await fetch(`${URL_BASE}/rest/v1/rpc/${fn}`, { method:"POST", headers, body:JSON.stringify(body) });
  if (!r.ok) throw new Error("Le serveur n'a pas répondu (" + r.status + ").");
  return r.json();
}
async function config(){
  if (!REF || !KEY){ try { const c = await (await fetch("config.json", { cache:"no-cache" })).json(); REF = REF || c.ref || ""; KEY = KEY || c.key || ""; } catch {} }
  URL_BASE = /^[a-z0-9]{8,40}$/.test(REF) ? `https://${REF}.supabase.co` : "";
}
async function charger(){
  if (!URL_BASE) await config();
  if (!URL_BASE || !KEY || !TOKEN){ etat("Lien incomplet", "Ouvrez le lien complet reçu sur WhatsApp, sans le couper."); return; }
  try {
    const r = await rpc("partage_lire", { p_token:TOKEN });
    if (!r.ok){ etat("Lien expiré ou désactivé", "Demandez un nouveau lien à l'entraîneur ou au club."); return; }
    data = r; rendre();
  } catch (e){ if (!data) etat("Connexion impossible", "Vérifiez votre connexion internet puis rechargez la page."); }
}
function etat(t, p){ $("#main").innerHTML = `<div class="etat"><h2>${h(t)}</h2><p>${h(p)}</p></div>`; }
const indisposMoi = new Set();   // noms déclarés indisponibles depuis ce téléphone
function jourArbitrage(d){
  const noms = (data.indispos || {})[d] || [], cle = "indispo|" + d;
  const liste = noms.length ? `<div class="indispos">Indisponibles : ${noms.map(n => `<b class="${indisposMoi.has(norm(n)) ? "moi" : ""}">${h(n)}</b>`).join(", ")}</div>` : "";
  if (ouvert === cle) return `<div class="jour-arb"><div class="haut"><div class="jour">${h(jour(d))}</div></div>${liste}
    <form data-indispo="${h(d)}"><div class="saisie" style="padding:0"><label for="saisieNom">Votre prénom et nom : indisponible le ${h(jour(d))}</label><input id="saisieNom" type="text" autocomplete="name" maxlength="60" placeholder="ex. Léo Martin" value="${h(store.get("pb-nom"))}">
    <div class="actions"><button type="button" class="btn annuler" data-annuler="1">Annuler</button><button type="submit" class="btn" style="background:var(--bad);color:#fff">Je suis indisponible</button></div></div></form></div>`;
  return `<div class="jour-arb"><div class="haut"><div class="jour">${h(jour(d))}</div><button type="button" class="btn indispo" data-indispo="${h(d)}">Je suis indisponible ce jour</button></div>${liste}</div>`;
}
function rendre(){
  $("#club").textContent = data.club || "Inscriptions";
  $("#titre").textContent = data.titre || "Officiels et bénévoles";
  document.title = `${data.titre || "Inscriptions"} - ${data.club || ""}`;
  const garde = ouvert ? ($("#saisieNom")?.value ?? null) : null;
  const cols = data.colonnes || [];
  let html = data.arbitrage ? `<p class="intro">Inscrivez-vous comme arbitre sur un match libre avec <b>Je m'inscris</b>. Si vous ne pouvez pas arbitrer un jour, appuyez sur <b>Je suis indisponible ce jour</b> : votre nom s'ajoute à la liste du jour. En cas d'empêchement après inscription, prévenez sur le groupe WhatsApp.</p>` : `<p class="intro">Appuyez sur <b>Je m'inscris</b> sur un rôle libre, puis indiquez votre prénom et nom. Vous pouvez prendre plusieurs rôles (par exemple à deux). Une fois inscrit, seul le club peut modifier ou annuler : prévenez sur le groupe WhatsApp en cas d'empêchement.</p>`;
  if (!data.matchs.length) html += `<div class="etat"><h2>Aucun match à venir</h2><p>Les prochains matchs à domicile apparaîtront ici.</p></div>`;
  let dernier = "";
  for (const m of data.matchs){
    if (m.date !== dernier){ dernier = m.date; html += data.arbitrage ? jourArbitrage(m.date) : `<div class="jour">${h(jour(m.date))}</div>`; }
    const libres = cols.filter(c => !(m.valeurs || {})[c.k]).length;
    html += `<section class="carte"><div class="entete"><span class="heure">${h(heure(m.heure))}</span><div class="affiche"><b>${h(m.equipe)}${m.club_equipe ? " · " + h(m.club_equipe) : ""} reçoit ${h(m.adversaire || "?")}</b><span>${h(m.salle || "Salle à préciser")} · ${libres ? `${libres} rôle${libres > 1 ? "s" : ""} libre${libres > 1 ? "s" : ""}` : "complet"}</span></div></div>
      <div class="roles">${cols.map(c => {
        const v = (m.valeurs || {})[c.k];
        if (v) return `<div class="role pris ${inscrits.has(norm(v)) ? "moi" : ""}"><span class="lib">${h(c.l)}<small>${h(v)}</small></span><span></span></div>`;
        const cle = m.id + "|" + c.k;
        if (ouvert === cle) return `<form class="role ouvert" data-m="${h(m.id)}" data-k="${h(c.k)}"><span class="lib">${h(c.l)}<small>${h(jour(m.date))} à ${h(heure(m.heure))}</small></span><span></span>
          <div class="saisie"><label for="saisieNom">Votre prénom et nom</label><input id="saisieNom" type="text" autocomplete="name" maxlength="60" placeholder="ex. Julie Martin" value="${h(garde ?? store.get("pb-nom"))}">
          <div class="actions"><button type="button" class="btn annuler" data-annuler="1">Annuler</button><button type="submit" class="btn confirmer">Valider</button></div></div></form>`;
        return `<div class="role"><span class="lib">${h(c.l)}<small>${c.req ? "À pourvoir" : "Libre"}</small></span><button type="button" class="btn" data-m="${h(m.id)}" data-k="${h(c.k)}">Je m'inscris</button></div>`;
      }).join("")}</div></section>`;
  }
  if (data.expire_le) html += `<p class="pied">Lien valable jusqu'au ${h(jour(String(data.expire_le).slice(0, 10)))}.</p>`;
  $("#main").innerHTML = html;
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-annuler]")){ ouvert = null; rendre(); return; }
  const di = e.target.closest("button[data-indispo]");
  const b = e.target.closest("button[data-m]"); if (!b && !di) return;
  ouvert = di ? "indispo|" + di.dataset.indispo : b.dataset.m + "|" + b.dataset.k; rendre();
  const inp = $("#saisieNom"); if (inp){ inp.focus(); inp.select(); inp.closest("form").scrollIntoView({ block:"center", behavior:"smooth" }); }
});
document.addEventListener("submit", async e => {
  const fi = e.target.closest("form[data-indispo]");
  if (fi){
    e.preventDefault();
    const nom = $("#saisieNom").value.trim();
    if (nom.length < 2){ $("#saisieNom").focus(); toast("Indiquez votre prénom et nom.", true); return; }
    fi.querySelector("button[type=submit]").disabled = true;
    try {
      const r = await rpc("partage_indispo", { p_token:TOKEN, p_date:fi.dataset.indispo, p_nom:nom });
      ouvert = null;
      if (r.ok){ store.set("pb-nom", nom); indisposMoi.add(norm(nom)); toast("C'est noté : indisponible ce jour-là."); }
      else toast(r.raison === "lien_invalide" ? "Ce lien n'est plus valable." : "Enregistrement refusé.", true);
    } catch (err){ toast(err.message, true); }
    await charger(); return;
  }
  const f = e.target.closest("form[data-m]"); if (!f) return;
  e.preventDefault();
  const nom = $("#saisieNom").value.trim();
  if (nom.length < 2){ $("#saisieNom").focus(); toast("Indiquez votre prénom et nom.", true); return; }
  const btn = f.querySelector("button[type=submit]"); btn.disabled = true;
  try {
    const r = await rpc("partage_ecrire", { p_token:TOKEN, p_match:f.dataset.m, p_champ:f.dataset.k, p_valeur:nom });
    ouvert = null;
    if (r.ok){ store.set("pb-nom", nom); inscrits.add(norm(nom)); toast("C'est noté, merci !"); }
    else toast(r.raison === "deja_pris" ? "Quelqu'un vient de prendre ce rôle." : r.raison === "lien_invalide" ? "Ce lien n'est plus valable." : "Inscription refusée.", true);
  } catch (err){ toast(err.message, true); btn.disabled = false; return; }
  await charger();
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) charger(); });
setInterval(() => { if (!document.hidden && !ouvert) charger(); }, 30000);
charger();
</script>
</body>
</html>
