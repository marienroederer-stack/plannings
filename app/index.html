<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FR Blanzat Basket - gestion des matchs</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d4561c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/barlow-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/barlow-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/barlow-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/barlow-condensed-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/barlow-condensed-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/barlow-condensed-latin-700-normal.woff2') format('woff2')}
body{margin:0;font-family:var(--f-body)}
[hidden]{display:none!important}
img{max-width:100%}
/* (polices locales ci-dessus) */
/* Layout : en-tête de club, onglets façon feuille de match, listes groupées par week-end avec horaires en chiffres de tableau d'affichage */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f5; --line:#d9dee6; --fg:#141a24; --muted:#5a6476;
  --accent:#d4561c; --accent-ink:#ffffff; --accent-soft:#fbe7dc;
  --dom:#17734a; --dom-soft:#dff1e7; --ext:#2f55a4; --ext-soft:#e2e9f8;
  --warn:#9a6200; --warn-soft:#fbefd4; --bad:#b3261e; --bad-soft:#f9e1df;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#161b24; --surface-2:#1d2430; --line:#2b3342; --fg:#e7eaf0; --muted:#97a1b3;
  --accent-soft:#3a2418; --dom:#4fc68a; --dom-soft:#16301f; --ext:#7ea2f0; --ext-soft:#1a2440;
  --warn:#e3a93c; --warn-soft:#33270f; --bad:#f08077; --bad-soft:#3a1714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#161b24; --surface-2:#1d2430; --line:#2b3342; --fg:#e7eaf0; --muted:#97a1b3;
  --accent-soft:#3a2418; --dom:#4fc68a; --dom-soft:#16301f; --ext:#7ea2f0; --ext-soft:#1a2440;
  --warn:#e3a93c; --warn-soft:#33270f; --bad:#f08077; --bad-soft:#3a1714; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* En-tête */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.brand h1{font-size:24px;line-height:1.05}
.brand .season{font-size:13px;color:var(--muted)}
.brand .grow{flex:1;min-width:0}
.ro-pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.02em;text-decoration:none;color:var(--muted);padding:8px 12px 10px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs a:hover{color:var(--fg)}
main{padding-block:18px 60px;display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
main > *{min-width:0}

/* Contrôles */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 11px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.toolbar .field{width:auto}
.toolbar .grow{flex:1 1 180px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check input{margin-top:3px;flex:none}
.spacer{flex:1}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-display);font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:5px;white-space:nowrap}
.b-dom{background:var(--dom-soft);color:var(--dom)}
.b-ext{background:var(--ext-soft);color:var(--ext)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-neutral{background:var(--surface-2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:3px;background:var(--c,var(--muted));flex:none}

/* Logos */
.logo{flex:none;border-radius:7px;overflow:hidden;display:grid;place-items:center;background:var(--surface-2)}
.logo.img{background:#fff;padding:2px;border:1px solid var(--line)}
.logo img{width:100%;height:100%;object-fit:contain;transform:translate(var(--lx,0%),var(--ly,0%)) scale(var(--lz,1));transform-origin:center}
.logo.img.sansfond{background:transparent;border-color:transparent}
.logo.img.noir{background:#111;border-color:#111}
.cadre-edit{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.cadre-edit input[type=range]{width:100%}
@media (max-width:520px){.cadre-edit{grid-template-columns:1fr}}
.logo b{font-family:var(--f-display);font-weight:700;color:#fff;letter-spacing:.02em}

/* Liste des matchs */
.group{display:grid;gap:8px}
.group-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:4px 2px}
.group-head h2{font-size:22px}
.group-head .count{font-size:13px;color:var(--muted)}
.day-head{font-family:var(--f-display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 2px 0}
.match{display:grid;grid-template-columns:86px minmax(0,1.1fr) minmax(0,2fr) minmax(0,1.1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--side,var(--line));border-radius:var(--r);padding:10px 14px;cursor:pointer;text-align:left;width:100%}
.match:hover{border-color:var(--muted);border-left-color:var(--side,var(--muted))}
.match.dom{--side:var(--dom)} .match.ext{--side:var(--ext)}
.match.off{opacity:.62}
.time{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.time small{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin-top:3px}
.team{display:grid;gap:2px;min-width:0}
.team .comp{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.affiche{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;min-width:0}
.side{display:flex;align-items:center;gap:8px;min-width:0}
.side.home{justify-content:flex-end;text-align:right}
.side .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.side.us .nm{color:var(--fg)}
.side.them .nm{color:var(--muted);font-weight:500}
.vs{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--muted);min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.vs.score{font-size:19px;color:var(--fg)}
.place{font-size:13px;min-width:0}
.place .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flags{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--dom)}
@media (max-width:860px){
  .match{grid-template-columns:58px minmax(0,1fr);gap:6px 12px;padding:10px 12px}
  .match .time{grid-row:span 3;align-self:start;padding-top:2px}
  .match .affiche,.match .place,.match .flags{grid-column:2}
  .flags{justify-content:flex-start}
  .time{font-size:22px}
}
@media (max-width:480px){
  .affiche{grid-template-columns:1fr;gap:4px}
  .side.home{justify-content:flex-start;text-align:left}
  .vs{text-align:left}
}

/* Calendrier */
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav h2{font-size:22px;min-width:180px;text-transform:capitalize}
.cal-scroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:840px}
.cal .dh{background:var(--surface-2);font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px}
.cal .cell{background:var(--surface);min-height:104px;padding:6px;display:grid;align-content:start;gap:3px}
.cal .cell.out{background:var(--surface-2)}
.cal .cell.today .d{background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:0 5px}
.cal .d{font-family:var(--f-display);font-weight:600;font-size:14px;justify-self:start}
.cal .ev{font-size:12px;line-height:1.25;border-radius:5px;padding:3px 5px;cursor:pointer;border:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.cal .ev.dom{background:var(--dom-soft);color:var(--dom)} .cal .ev.ext{background:var(--ext-soft);color:var(--ext)}
.cal .ev b{font-variant-numeric:tabular-nums}

/* Tableaux */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td input[type=text],td input[type=password],td input[type=time]{padding:5px 7px;min-width:104px}
th{white-space:normal}
th:first-child,th:nth-child(2){white-space:nowrap}
td.miss input,input.miss{border-color:var(--warn);background:var(--warn-soft)}
.pile{display:grid;gap:4px}
/* Impression (version web) */
#printZone{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body.impression > *:not(#printZone){display:none!important}
  body.impression{background:#fff}
  body.impression #printZone{display:block;color:#141a24;font-family:var(--f-body);font-size:10pt}
  .pz-page{page-break-after:always}
  .pz-page header{display:flex;gap:12px;align-items:center;margin-bottom:8px}
  .pz-page header img{width:60px;height:60px;object-fit:contain}
  .pz-page header small{color:#d4561c;font-family:var(--f-display);font-weight:600;letter-spacing:.1em}
  .pz-page h1{font-family:var(--f-display);font-size:20pt;margin:0}
  .pz-page header p{margin:0;color:#5a6476}
  .pz-page table{width:100%;border-collapse:collapse;font-size:9.5pt}
  .pz-page th{background:#141a24;color:#fff;text-align:left;padding:5px;font-family:var(--f-display)}
  .pz-page td{padding:5px;border-bottom:1px solid #ccd;vertical-align:top}
  .pz-page tbody tr:nth-child(odd) td{background:#eef1f5}
  .pz-h{font-family:var(--f-display);font-weight:700;font-size:13pt}
  .pz-m{color:#5a6476}.pz-a{color:#b45a00}
  .pz-page footer{margin-top:8px;color:#5a6476;font-size:8pt}
}
.etat-off{color:var(--bad);font-weight:600}
.conflit-btn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.conflit{display:grid;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.vs-vals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs-vals > div{display:grid;gap:2px;background:var(--surface-2);border-radius:8px;padding:6px 8px;min-width:0;overflow-wrap:anywhere}
tr.indispo-row td{background:var(--bad-soft);color:var(--bad);font-size:12.5px;padding:5px 10px}
.indispo-nom{display:inline-flex;align-items:center;gap:2px;margin-right:6px;font-weight:600}
.indispo-nom .x{border:0;background:transparent;color:var(--bad);cursor:pointer;font-size:14px;line-height:1;padding:0 3px;border-radius:4px}
.indispo-nom .x:hover{background:rgba(0,0,0,.08)}
.avec-cle{display:flex;gap:3px;align-items:center;min-width:0}
.avec-cle > input{flex:1;min-width:0}
.cle-btn{flex:none;width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--accent);cursor:pointer;padding:0}
.cle-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.lic-btn{font-family:var(--f-display);font-weight:700;font-size:11.5px;color:var(--ext)}
.lic-btn:hover{border-color:var(--ext);background:var(--ext-soft)}
.partage-btn{margin-top:6px;padding:3px 9px;font-size:12.5px}
.partage-btn.fait{color:var(--dom);border-color:var(--dom)}
main.large{max-width:none}
.tbl-fit table{table-layout:fixed;width:100%;min-width:880px}
.tbl-fit th{white-space:normal;font-size:11.5px;letter-spacing:.05em;padding:8px 6px;vertical-align:bottom;line-height:1.25}
.tbl-fit td{padding:6px;overflow:hidden}
.tbl-fit td input[type=text],.tbl-fit td input[type=password],.tbl-fit td input[type=time]{min-width:0;width:100%;padding:4px 6px;font-size:13px;text-overflow:ellipsis}
.tbl-fit .quand{font-size:13px;line-height:1.3}
.tbl-fit .quand .small{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tbl-fit .match-c .chip{white-space:normal;font-size:13px}
.tbl-fit .match-c .small{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td .rd{white-space:nowrap}
tr.sep td{background:var(--surface-2);font-family:var(--f-display);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:13px;color:var(--muted);padding:6px 10px}

/* Salles */
.tl{display:grid;gap:10px}
.tl-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center}
.tl-track{position:relative;height:46px;background:var(--surface-2);border-radius:8px;overflow:hidden}
.tl-hours{position:relative;height:18px;margin-left:160px;font-size:11px;color:var(--muted)}
.tl-hours span{position:absolute;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.tl-block{position:absolute;top:4px;bottom:4px;border-radius:6px;background:var(--dom-soft);border:1px solid var(--dom);color:var(--dom);font-size:11.5px;line-height:1.15;padding:3px 6px;overflow:hidden;cursor:pointer;text-align:left}
.tl-block.conflict{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.tl-block.half{bottom:50%;} .tl-block.half2{top:50%}
.tl-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
@media (max-width:640px){.tl-row{grid-template-columns:1fr}.tl-hours{margin-left:0}}

/* Cartes bibliothèque */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--muted)}
.card .t{min-width:0}
.card .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* États */
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--surface)}
.empty h2{font-size:24px}
.empty p{max-width:52ch;margin:0;color:var(--muted)}
.steps{display:grid;gap:8px;text-align:left;max-width:520px;margin:4px 0;padding-left:20px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-weight:500}
.banner .btn{color:var(--fg)}
.stat-line{display:flex;gap:18px;flex-wrap:wrap}
.stat-line div{display:grid}
.stat-line b{font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.stat-line span{font-size:12.5px;color:var(--muted)}

/* Dialogue */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--fg);width:min(720px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(10,14,20,.5)}
.dlg{display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-height:calc(100dvh - 26px)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h2{font-size:22px;flex:1}
.dlg-b{overflow-y:auto;padding:16px 18px;display:grid;gap:16px}
.dlg-f{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
fieldset{border:0;padding:0;margin:0;display:grid;gap:10px}
legend{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ac-box{position:fixed;z-index:100;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:4px;max-height:260px;overflow-y:auto}
.ac-it{padding:6px 9px;border-radius:7px;cursor:pointer;font-size:14px}
.ac-it:hover,.ac-it.on{background:var(--accent-soft)}
.ac-foot{padding:5px 9px 3px;border-top:1px solid var(--line);margin-top:3px}
.lock{font-size:12.5px;color:var(--warn);background:var(--warn-soft);padding:6px 10px;border-radius:8px}
.ffbb-info{font-size:12.5px;color:var(--muted);background:var(--surface-2);padding:6px 10px;border-radius:8px}

<script>
"use strict";
/* ============ Utilitaires ============ */
const $ = (s, r = document) => r.querySelector(s);
const h = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const JOURS_C = ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const parseD = s => { const [y,m,d] = String(s||"").split("-").map(Number); return y ? new Date(y, m-1, d) : null; };
const fmtD = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => fmtD(new Date());
const toMin = t => { const m = /^(\d{1,2})[:hH](\d{2})/.exec(t||""); return m ? (+m[1])*60 + (+m[2]) : null; };
const fmtH = t => { const m = toMin(t); return m == null ? "—" : `${Math.floor(m/60)}h${pad(m%60)}`; };
function weekendKey(ds){ // samedi de la semaine (lun→dim)
  const d = parseD(ds); if(!d) return "0000-00-00"; const wd = d.getDay();
  const mon = addDays(d, wd === 0 ? -6 : 1 - wd); return fmtD(addDays(mon, 5));
}
function weekendLabel(k){
  const sa = parseD(k), di = addDays(sa, 1);
  return sa.getMonth() === di.getMonth() ? `Week-end des ${er(sa.getDate())} et ${di.getDate()} ${MOIS[di.getMonth()]}` : `Week-end du ${sa.getDate()} ${MOIS[sa.getMonth()]} au ${er(di.getDate())} ${MOIS[di.getMonth()]}`;
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const er = n => n === 1 ? "1er" : String(n);
const dayLabel = ds => { const d = parseD(ds); return d ? `${JOURS[d.getDay()]} ${er(d.getDate())} ${MOIS[d.getMonth()]}` : "Date à fixer"; };
function season(){ const d = new Date(), y = d.getMonth() >= 7 ? d.getFullYear() : d.getFullYear()-1; return `Saison ${y}-${y+1}`; }
function hashColor(s){ let x = 0; for (const c of String(s)) x = (x*31 + c.charCodeAt(0)) >>> 0; return `hsl(${x % 360} 45% 40%)`; }
function initials(s){ const w = String(s||"?").replace(/[^\p{L}\p{N} ]/gu," ").split(/\s+/).filter(w => w.length > 2 || /\d/.test(w)); return (w.length ? w.slice(0,2).map(x => x[0]) : [String(s||"?")[0]]).join("").toUpperCase(); }
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const uid = p => p + "-" + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
let toastT; function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
const LS = { get(k, d){ try { const v = localStorage.getItem("pb:"+k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v){ try { localStorage.setItem("pb:"+k, JSON.stringify(v)); } catch {} } };

/* ============ État ============ */
const S = { equipes:new Map(), clubs:new Map(), salles:new Map(), matchs:new Map(), codes:new Map(), licencies:new Map(), indispos:new Map(), reglages:{}, ready:{}, demo:false };
let isAdmin = true, niveau = "administrateur";   // administrateur | utilisateur | lecteur
const ROUTES_ADMIN = ["clubs","donnees","licencies","reglages"];
const LIB_NIVEAU = { administrateur:"Administrateur", utilisateur:"Utilisateur", lecteur:"Consultation" };
function appliquerRole(role){
  niveau = role === "administrateur" || role === "editeur" ? "administrateur" : role === "utilisateur" ? "utilisateur" : "lecteur";
  isAdmin = niveau === "administrateur"; canWrite = niveau !== "lecteur";
}
let api = null, CFG = {}, logoBase = "", canWrite = true, dbState = "loading", session = null, lastSync = "", syncedAt = null, syncBusy = false;
const F = Object.assign({ equipe:"", lieu:"tous", periode:"avenir", q:"", mode:"weekend", mois:today().slice(0,7), salleJour:"" }, LS.get("filtres", {}));
const saveF = () => LS.set("filtres", { equipe:F.equipe, lieu:F.lieu, periode:F.periode, mode:F.mode });
const ROUTES = ["planning","equipes","salles","officiels","transport","clubs","donnees","licencies","reglages"];
const route = () => { const r = location.hash.slice(1); return ROUTES.includes(r) && (isAdmin || !ROUTES_ADMIN.includes(r)) ? r : "planning"; };
const DEF_OFF = [{k:"arbitre1",l:"Arbitre 1",req:true},{k:"arbitre2",l:"Arbitre 2"},{k:"marqueur",l:"Marqueur",req:true},{k:"chrono",l:"Chronométreur",req:true},{k:"op24",l:"Aide-marqueur"},{k:"respSalle",l:"Responsable de salle",req:true},{k:"respFairPlay",l:"Responsable fair-play"}];
const DEF_DEP = [{k:"rdvHeure",l:"Heure de RDV",req:true,type:"time",fixe:true},{k:"rdvLieu",l:"Lieu de RDV"},{k:"chauffeurs",l:"Chauffeurs / parents",req:true},{k:"accompagnateur",l:"Accompagnateur"}];
/* Colonnes « sous la précédente » : réglage explicite, sinon regroupement par défaut (arbitres, marqueurs, rôles en double) */
function avecPiles(cols){
  if (cols.some(c => c.stack !== undefined)) return cols;
  return cols.map((c, i) => { const p = cols[i-1]; if (!p) return { ...c };
    const auto = (c.k === "arbitre2" && p.k === "arbitre1") || (c.k === "op24" && p.k === "marqueur") || norm(c.l) === norm(p.l);
    return auto ? { ...c, stack:true } : { ...c }; });
}
const colsOff = () => avecPiles(Array.isArray(S.reglages.colsOfficiels) && S.reglages.colsOfficiels.length ? S.reglages.colsOfficiels : DEF_OFF);
const colsDep = () => Array.isArray(S.reglages.colsDeplacements) && S.reglages.colsDeplacements.length ? S.reglages.colsDeplacements : DEF_DEP;
const offReq = () => colsOff().filter(c => c.req).map(c => c.k);
const filled = v => String(v ?? "").trim() !== "";
const FFBB_FIELDS = ["date","heure","domicile","equipeId","adversaireClubId","adversaireNom","salleId","salleNom","competition","journee","scoreNous","scoreEux","statut"];
const FFBB_GROUPES = [["date",["date"],"Date"],["heure",["heure"],"Heure"],["domicile",["domicile"],"Lieu"],["equipeId",["equipeId"],"Équipe"],["adversaire",["adversaireClubId","adversaireNom"],"Adversaire"],["salle",["salleId","salleNom"],"Salle"],["competition",["competition"],"Compétition"],["journee",["journee"],"Journée"],["score",["scoreNous","scoreEux"],"Score"],["statut",["statut"],"Statut"]];
const sv = v => String(v ?? "");
function fmtFfbb(g, src){
  switch (g){
    case "date": return src.date ? dayLabel(src.date) : "—";
    case "heure": return fmtH(src.heure);
    case "domicile": return src.domicile ? "Domicile" : "Extérieur";
    case "equipeId": return equipe(src.equipeId)?.nom || "—";
    case "adversaire": return club(src.adversaireClubId)?.nom || src.adversaireNom || "—";
    case "salle": return salle(src.salleId)?.nom || src.salleNom || "—";
    case "score": return sv(src.scoreNous) !== "" ? `${src.scoreNous}–${src.scoreEux}` : "—";
    case "statut": return STATUTS[src.statut || "prevu"]?.[0] || "—";
    default: return sv(src[g]) || "—";
  }
}
/* Écarts entre la valeur affichée et la dernière valeur officielle FFBB */
function ecarts(m){
  if (!m?.ffbb) return [];
  const cle = (o, idf, nf) => sv(o[idf]) || norm(o[nf]);
  return FFBB_GROUPES.filter(([g, fs]) => g === "adversaire" ? cle(m, "adversaireClubId", "adversaireNom") !== cle(m.ffbb, "adversaireClubId", "adversaireNom")
    : g === "salle" ? cle(m, "salleId", "salleNom") !== cle(m.ffbb, "salleId", "salleNom")
    : fs.some(f => sv(m[f]) !== sv(m.ffbb[f])))
    .map(([g, fs, l]) => ({ g, fs, l, nous:fmtFfbb(g, m), ffbb:fmtFfbb(g, m.ffbb), fige:(m.figes || []).includes(g) }));
}
const STATUTS = { prevu:["Prévu",""], reporte:["Reporté","b-warn"], annule:["Annulé","b-bad"], joue:["Joué","b-neutral"], forfait:["Forfait","b-bad"] };

/* ============ Accès aux données ============ */
const logoURL = id => /^(https?:|data:)/.test(id) ? id : logoBase + encodeURIComponent(id);
const equipe = id => S.equipes.get(id);
const club = id => S.clubs.get(id);
const salle = id => S.salles.get(id);
const clubDe = e => e?.clubId ? (club(e.clubId)?.nom || e.clubNom || "") : "";
const nomEquipe = m => { const e = equipe(m.equipeId); return (e?.nom || m.equipeNom || "Équipe ?") + (e?.clubId ? " · " + clubDe(e) : ""); };
const isVisible = eid => equipe(eid)?.visible !== false;
const visibleM = m => isVisible(m.equipeId);
const usNom = m => { const e = equipe(m.equipeId); return e?.clubId ? clubDe(e) : notreNom(); };
const usLogoM = (m, s) => { const e = equipe(m.equipeId); return e?.clubId ? logoHTML(club(e.clubId) || { nom:clubDe(e) }, s, clubDe(e)) : usLogo(s); };
function ctcClubs(){
  const l = Array.isArray(S.reglages.ffbbClubs) ? S.reglages.ffbbClubs : [];
  if (l.length) return l;
  const p = S.reglages.ffbbId || CFG.ffbbClubId; return p ? [{ ffbbId:String(p), nom:S.reglages.nom || "", principal:true }] : [];
}
const advBrut = m => club(m.adversaireClubId)?.nom || m.adversaireNom || "";
/* Match « exempt » : la FFBB n'envoie pas d'adversaire (ou un adversaire nommé EXEMPT) — rien à jouer ni à organiser */
const isExempt = m => { const a = norm(advBrut(m)); return a === "exempt" || a === "exempte" || (m.source === "ffbb" && !a); };
const advNom = m => isExempt(m) ? "Exempté" : (advBrut(m) || "Adversaire à définir");
const salleNom = m => salle(m.salleId)?.nom || m.salleNom || "";
const notreNom = () => S.reglages.nom || "Notre club";
const dureeOf = m => +(equipe(m.equipeId)?.duree || S.reglages.dureeMatch || 105);
const isOff = m => m.statut === "annule" || m.statut === "reporte" || isExempt(m);
function sortedEquipes(){ return [...S.equipes.entries()].sort((a,b) => (a[1].ordre ?? 999) - (b[1].ordre ?? 999) || String(a[1].nom).localeCompare(String(b[1].nom), "fr", {numeric:true})); }
function sortMatches(arr){ return arr.sort((a,b) => (a[1].date||"9").localeCompare(b[1].date||"9") || (a[1].heure||"99").localeCompare(b[1].heure||"99") || nomEquipe(a[1]).localeCompare(nomEquipe(b[1]), "fr", {numeric:true})); }
function logoHTML(entity, size = 32, label){
  const name = label || entity?.nom || "?";
  if (entity?.logo){ const c = entity.logoCadre || {}; return `<span class="logo img ${c.fond === "transparent" ? "sansfond" : c.fond === "noir" ? "noir" : ""}" style="width:${size}px;height:${size}px;--lz:${+c.zoom || 1};--lx:${+c.x || 0}%;--ly:${+c.y || 0}%"><img src="${h(logoURL(entity.logo))}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'${h(initials(name))}'}));this.parentNode&&(this.parentNode.style.background='${hashColor(name)}')"></span>`; }
  if (entity?.demoColor) return `<span class="logo" style="width:${size}px;height:${size}px;background:${entity.demoColor};border-color:transparent"><b style="font-size:${Math.round(size*.38)}px">${h(initials(name))}</b></span>`;
  return `<span class="logo" style="width:${size}px;height:${size}px;background:${hashColor(name)};border-color:transparent"><b style="font-size:${Math.round(size*.38)}px">${h(initials(name))}</b></span>`;
}
const usLogo = (s=32) => logoHTML({ nom:notreNom(), logo:S.reglages.logo, logoCadre:S.reglages.logoCadre, demoColor:S.demo ? "var(--accent)" : null }, s);
const advLogo = (m, s=32) => logoHTML(club(m.adversaireClubId) || { nom:advNom(m) }, s, advNom(m));

/* Conflits de salle */
function conflicts(){
  const out = new Set(), by = new Map();
  for (const [id, m] of S.matchs){
    if (!m.domicile || isOff(m) || !m.date || toMin(m.heure) == null || !visibleM(m)) continue;
    const sk = m.salleId || norm(m.salleNom); if (!sk) continue; const k = m.date + "|" + sk;
    if (!by.has(k)) by.set(k, []); by.get(k).push([id, m]);
  }
  for (const list of by.values()){
    for (let i = 0; i < list.length; i++) for (let j = i+1; j < list.length; j++){
      const a = list[i][1], b = list[j][1], as = toMin(a.heure), bs = toMin(b.heure);
      if (as < bs + dureeOf(b) && bs < as + dureeOf(a)) { out.add(list[i][0]); out.add(list[j][0]); }
    }
  }
  return out;
}

/* Écritures : mise à jour locale immédiate, puis envoi à la base */
function applyLocal(coll, id, data){ if (coll === "reglages"){ if (id === "club"){ S.reglages = data; } return; } S[coll]?.set(id, data); }
async function call(name, ...args){
  const r = await api[name](...args);
  if (r && !r.ok && r.offline) throw Object.assign(new Error("Pas de connexion internet."), { code:"offline" });
  if (!r || !r.ok){
    const st = r?.status;
    if (st === 401 || st === 403 || /row-level security|permission/i.test(r?.error || "")){ if (niveau === "utilisateur") throw Object.assign(new Error("Action réservée aux administrateurs."), { code:"ro" }); if (canWrite){ canWrite = false; updateRO(); scheduleRender(); } throw Object.assign(new Error("Votre compte est en consultation : demandez le rôle éditeur."), { code:"ro" }); }
    throw new Error(r?.error || "Erreur de connexion à la base.");
  }
  return r;
}
/* ============ Hors connexion : copie locale, file d'attente, conflits ============ */
const COLLS = ["equipes","clubs","salles","matchs","codes","licencies","indispos"];
const IGNORE_CONFLIT = new Set(["maj"]);   // champs techniques : la dernière valeur l'emporte
let horsLigne = false, FILE = [], CONFLITS = [], ABANDONS = [], cacheT = 0, avertiHorsLigne = false;
const clone = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));
const valeur = (c, id) => c === "reglages" ? (id === "club" ? S.reglages : undefined) : S[c]?.get(id);
const stable = v => JSON.stringify(v, (k, x) => x && typeof x === "object" && !Array.isArray(x) ? Object.keys(x).sort().reduce((o, kk) => (o[kk] = x[kk], o), {}) : x);
const vide = x => x === undefined || x === null || x === "" ? null : x;
const egal = (a, b) => stable(vide(a)) === stable(vide(b));
function enfiler(c, id, avant, apres){
  let e = FILE.find(x => x.c === c && x.id === id);
  if (!e){ e = { c, id, champs:{}, nouveau:avant === undefined }; FILE.push(e); }
  if (apres === null){
    if (e.nouveau) FILE.splice(FILE.indexOf(e), 1);   // créé puis supprimé hors connexion : rien à envoyer
    else { e.del = true; e.champs = {}; }
  } else {
    delete e.del;
    for (const k of new Set([...Object.keys(avant || {}), ...Object.keys(apres || {})])){
      if (!(k in e.champs)){ if (egal(avant?.[k], apres?.[k])) continue; e.champs[k] = { base:clone(avant?.[k]) ?? null }; }
      e.champs[k].val = clone(apres?.[k]) ?? null;
      if (egal(e.champs[k].base, e.champs[k].val)) delete e.champs[k];
    }
    if (!Object.keys(e.champs).length) FILE.splice(FILE.indexOf(e), 1);
  }
  sauverCache(true); majEtat();
}
function passerHorsLigne(){
  if (!horsLigne){ horsLigne = true; if (!avertiHorsLigne){ avertiHorsLigne = true; toast("Connexion perdue : vos modifications sont gardées sur ce PC et partiront au retour du réseau."); } }
  majEtat();
}
async function write(coll, id, data, merge){
  const cur = valeur(coll, id), avant = clone(cur);
  const full = merge ? { ...(cur||{}), ...data } : data;
  applyLocal(coll, id, full); scheduleRender();
  if (S.demo) return;
  if (horsLigne){ enfiler(coll, id, avant, full); return; }
  try { if (merge && cur) await call("merge", coll, id, data); else await call("upsert", [{ collection:coll, id, data:full }]); sauverCache(); }
  catch (e){ if (e.code === "offline"){ passerHorsLigne(); enfiler(coll, id, avant, full); return; } toast(e.message || "Échec de l'enregistrement."); syncNow(true); throw e; }
}
async function writeMany(rows, onStep){
  const avant = rows.map(r => clone(valeur(r.collection, r.id)));
  for (const r of rows) applyLocal(r.collection, r.id, r.data);
  scheduleRender(); if (S.demo || !rows.length) return;
  const enAttente = from => { for (let j = from; j < rows.length; j++) enfiler(rows[j].collection, rows[j].id, avant[j], rows[j].data); };
  if (horsLigne){ enAttente(0); return; }
  for (let i = 0; i < rows.length; i += 200){
    try { await call("upsert", rows.slice(i, i+200)); }
    catch (e){ if (e.code === "offline"){ passerHorsLigne(); enAttente(i); return; } throw e; }
    onStep?.(Math.min(i+200, rows.length), rows.length);
  }
  sauverCache();
}
async function remove(coll, id){
  const avant = clone(valeur(coll, id)); S[coll].delete(id); scheduleRender(); if (S.demo) return;
  if (horsLigne){ enfiler(coll, id, avant, null); return; }
  try { await call("delete", coll, id); sauverCache(); }
  catch (e){ if (e.code === "offline"){ passerHorsLigne(); enfiler(coll, id, avant, null); return; } toast(e.message); syncNow(true); throw e; }
}
/* Copie locale sur le PC (données de la dernière synchronisation + modifications en attente) */
function etatLocal(){
  const data = {}; for (const c of COLLS) data[c] = Object.fromEntries(S[c]);
  return JSON.stringify({ v:1, base:CFG.url || "", email:session?.email || "", role:session?.role || "", lastSync, savedAt:new Date().toISOString(), data, reglages:S.reglages, file:FILE, conflits:CONFLITS, abandons:ABANDONS });
}
function sauverCache(tout_de_suite){

/* Au retour du réseau : envoyer la file, sans écraser ce qui a changé en ligne entre-temps */
async function envoyerFile(){
  const r = await call("fetch", lastSync || null);
  const enLigne = new Map(r.rows.map(x => [x.collection + "/" + x.id, x]));
  let envoyes = 0;
  for (const e of FILE.slice()){
    const srv = enLigne.get(e.c + "/" + e.id);
    try {
      if (e.del){ await call("delete", e.c, e.id); envoyes++; }
      else if (srv?.deleted){ ABANDONS.push({ c:e.c, id:e.id, raison:"supprimé en ligne entre-temps", le:new Date().toISOString(), libelle:libelleDoc(e.c, e.id) }); }
      else {
        const patch = {};
        for (const [k, ch] of Object.entries(e.champs)){
          const vSrv = srv ? srv.data?.[k] : ch.base;   // pas changé en ligne depuis la dernière synchro : valeur de départ
          if (egal(vSrv, ch.val)) continue;
          if (IGNORE_CONFLIT.has(k) || egal(vSrv, ch.base)) patch[k] = ch.val;
          else CONFLITS.push({ c:e.c, id:e.id, k, enLigne:clone(vSrv) ?? null, val:ch.val, le:new Date().toISOString(), libelle:libelleDoc(e.c, e.id) });
        }
        if (Object.keys(patch).length){ await call("merge", e.c, e.id, patch); envoyes++; }
      }
    } catch (err){
      if (err.code === "offline") throw err;
      ABANDONS.push({ c:e.c, id:e.id, raison:err.message || "refusé", le:new Date().toISOString(), libelle:libelleDoc(e.c, e.id) });
    }
    FILE.splice(FILE.indexOf(e), 1); sauverCache(true);
  }
  return envoyes;
}
async function reconnecter(){

  if (r.ok && r.resumed){ horsLigne = false; avertiHorsLigne = false; session = { email:r.email, role:r.role }; logoBase = r.logoBase || logoBase; appliquerRole(r.role); updateRO(); return true; }
  if (r.offline) return false;
  // session refusée (mot de passe changé…) : reconnexion manuelle, la file reste sur le PC
  horsLigne = false; session = null; dbState = "login"; render();
  toast(FILE.length ? "Reconnectez-vous : vos modifications en attente seront envoyées ensuite." : "Reconnectez-vous pour continuer.");
  return false;
}

}
function libelleDoc(c, id){
  const m = c === "matchs" || c === "codes" ? S.matchs.get(id) : null;
  if (m) return `${c === "codes" ? "Code e-Marque · " : ""}${nomEquipe(m)} – ${advNom(m)}, ${m.date ? dayLabel(m.date) : "date à fixer"} ${fmtH(m.heure)}`;

  if (c === "indispos") return "Arbitres indisponibles · " + dayLabel(id);

function libelleChamp(c, k){
  const col = [...colsOff(), ...colsDep()].find(x => x.k === k); if (col) return col.l;
  const g = FFBB_GROUPES.find(([, fs]) => fs.includes(k)); if (g) return g[2];

function montrerValeur(k, v){

}

async function resoudreConflit(i, garderMienne){
  const x = CONFLITS[i]; if (!x) return;
  if (garderMienne){
    if (horsLigne){ toast("Reconnectez-vous d'abord pour envoyer votre valeur."); return; }
    try { await call("merge", x.c, x.id, { [x.k]:x.val }); } catch (e){ if (e.code === "offline") passerHorsLigne(); toast(e.message); return; }
  }

async function runQueue(tasks, n = 4, onStep){ let i = 0, done = 0; const worker = async () => { while (i < tasks.length){ const t = tasks[i++]; try { await t(); } catch {} done++; onStep?.(done, tasks.length); } }; await Promise.all(Array.from({length:n}, worker)); }

/* Synchronisation entre les PC */
async function syncNow(full){
  if (S.demo || !api || !session || syncBusy) return; syncBusy = true;
  try {
    if (horsLigne){ if (!(await reconnecter())) return; full = true; }
    if (FILE.length){
      const n = await envoyerFile();
      toast((n ? `Connexion rétablie : ${n} modification${n > 1 ? "s" : ""} envoyée${n > 1 ? "s" : ""}.` : "Connexion rétablie.") + (CONFLITS.length ? ` ${CONFLITS.length} conflit${CONFLITS.length > 1 ? "s" : ""} à résoudre.` : ""));
      full = true;
    }
    const r = await call("fetch", full ? null : (lastSync || null));
    if (full){ for (const c of ["equipes","clubs","salles","matchs","codes","licencies","indispos"]) S[c] = new Map(); S.reglages = {}; }
    for (const row of r.rows){
      if (row.updated_at > lastSync) lastSync = row.updated_at;
      if (row.collection === "reglages"){ if (row.id === "club") S.reglages = row.deleted ? {} : row.data; continue; }
      const m = S[row.collection]; if (!m) continue;
      if (row.deleted) m.delete(row.id); else m.set(row.id, row.data);
    }
    dbState = "ok"; syncedAt = new Date(); horsLigne = false;
    if (r.rows.length || full){ scheduleRender(); sauverCache(); }
  } catch (e){
    if (e.code === "offline"){ passerHorsLigne(); if (dbState === "loading"){ const c = await lireCache(); if (c) appliquerCache(c, true); dbState = "ok"; scheduleRender(); } }
    else { const el = $("#syncInfo"); if (el) el.textContent = "Synchronisation impossible"; if (dbState === "loading"){ dbState = "ok"; scheduleRender(); } }
  }
  finally { syncBusy = false; majEtat(); }
}

function calendarView(list){

  let cells = ["lun.","mar.","mer.","jeu.","ven.","sam.","dim."].map(d => `<div class="dh">${d}</div>`).join("");
  for (let i = 0; i < 42; i++){

    const evs = (by.get(ds) || []).map(([id, m]) => `<button class="ev ${m.domicile ? "dom" : "ext"}" data-open="${h(id)}" title="${h(nomEquipe(m) + " – " + advNom(m))}"><b>${h(fmtH(m.heure))}</b> ${h(nomEquipe(m))} ${m.domicile ? "vs" : "@"} ${h(advNom(m))}</button>`).join("");

}

function vSalles(){

  if (F.salleJour){
    const sa = F.salleJour, days = [addDays(parseD(sa), -1), parseD(sa), addDays(parseD(sa), 1)].map(fmtD);
    const ws = weekendKey(sa), wkDays = []; for (let i = -5; i <= 1; i++) wkDays.push(fmtD(addDays(parseD(sa), i)));
    const ms = [...S.matchs.entries()].filter(([, m]) => m.domicile && wkDays.includes(m.date) && !isOff(m) && visibleM(m));
    const blocks = [];

      let lo = 24*60, hi = 0; for (const [, m] of dayMs){ const s = toMin(m.heure); if (s == null) continue; lo = Math.min(lo, s); hi = Math.max(hi, s + dureeOf(m)); }
      if (lo > hi){ lo = 9*60; hi = 20*60; }
      lo = Math.floor(lo/60)*60 - 0; hi = Math.ceil(hi/60)*60; const span = Math.max(hi - lo, 120);
      const pct = v => ((v - lo) / span * 100).toFixed(2) + "%";
      let hours = ""; for (let x = lo; x <= hi; x += 60) hours += `<span style="left:${pct(x)}">${x/60}h</span>`;
      const rows = [...bySalle.entries()].map(([nm, arr]) => {

        const bl = arr.map(([id, m], i) => { const s = toMin(m.heure); if (s == null) return ""; const lane = arr.slice(0, i).some(([, o]) => { const os = toMin(o.heure); return os != null && os < s + dureeOf(m) && s < os + dureeOf(o); }) ? "half2" : (conf.has(id) ? "half" : "");
          return `<button class="tl-block ${conf.has(id) ? "conflict" : ""} ${lane}" style="left:${pct(s)};width:calc(${pct(s + dureeOf(m))} - ${pct(s)})" data-open="${h(id)}" title="${h(fmtH(m.heure) + " " + nomEquipe(m) + " vs " + advNom(m))}"><b class="num">${h(fmtH(m.heure))}</b> ${h(nomEquipe(m))}<br><span>${h(advNom(m))}</span></button>`; }).join("");
        return `<div class="tl-row"><div><b>${h(nm)}</b><div class="muted small num">${arr.length} match${arr.length>1?"s":""}</div></div><div class="tl-track">${grid}${bl}</div></div>`;
      }).join("");
      blocks.push(`<section class="panel tl"><div class="row"><h3 style="font-size:19px">${h(cap(dayLabel(ds)))}</h3><span class="spacer"></span><span class="muted small num">${dayMs.length} match${dayMs.length>1?"s":""} à domicile</span></div><div class="tl-hours">${hours}</div>${rows}</section>`);

  return `<div class="toolbar"><label class="field"><span>Week-end</span><select id="fSalleJour">${wks.map(k => `<option value="${k}" ${k === F.salleJour ? "selected" : ""}>${h(weekendLabel(k))}</option>`).join("")}</select></label>
    <div class="field"><span>Durée d'un créneau</span><span class="row"><b class="num">${h(S.reglages.dureeMatch || 105)} min</b>${isAdmin ? `<a class="small" href="#reglages">par équipe dans Réglages</a>` : ""}</span></div>

  ${tl}
  <div class="row"><h2 style="font-size:22px">Bibliothèque des salles</h2><span class="spacer"></span>${canWrite ? `<button class="btn" data-edit-salle="">+ Ajouter une salle</button>` : ""}</div>

/* ---- Licenciés ---- */
/* Retrouver le licencié saisi dans une case (par n° de licence, sinon par prénom + nom exacts) */
let licIdx = { map:null, size:-1, parLic:new Map(), parNom:new Map() };
function licIndex(){
  if (licIdx.map === S.licencies && licIdx.size === S.licencies.size) return licIdx;
  const parLic = new Map(), parNom = new Map();
  for (const [id, l] of S.licencies){
    if (l.licence) parLic.set(String(l.licence).toUpperCase(), id);
    for (const n of [norm(`${l.prenom} ${l.nom}`), norm(`${l.nom} ${l.prenom}`)]) parNom.set(n, parNom.has(n) && parNom.get(n) !== id ? null : id);
  }
  return licIdx = { map:S.licencies, size:S.licencies.size, parLic, parNom };
}
function licDe(v){
  v = String(v || "").trim(); if (!v || !S.licencies.size) return null;
  const ix = licIndex(), lic = /([A-Z]{2}\d{6})\s*$/i.exec(v);
  const id = lic ? ix.parLic.get(lic[1].toUpperCase()) : ix.parNom.get(norm(v));
  return id ? [id, S.licencies.get(id)] : null;
}
const ICONE_CLE = `<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 20 3M16 7l3 3M14 9l2 2"/></svg>`;
function cleBtn(v){
  const r = licDe(v); if (!r || !r[1]?.cle) return "";
  return `<button type="button" class="cle-btn" data-cle="${h(r[0])}" title="Copier la clé de validation de ${h(licLabel(r[1]))}" aria-label="Copier la clé de validation">${ICONE_CLE}</button>`;
}
/* Colonnes où l'on copie le n° de licence (délégué de club, délégué fair-play… réglable dans Réglages) */
const estLicCol = c => c?.lic ?? (["respSalle", "respFairPlay"].includes(c?.k) || /delegue|responsable|fair.?play/.test(norm(c?.l)));
function licBtn(v){
  const r = licDe(v); if (!r || !r[1]?.licence) return "";
  return `<button type="button" class="cle-btn lic-btn" data-copielic="${h(r[0])}" title="Copier le n° de licence ${h(r[1].licence)} (${h(licLabel(r[1]).replace(/\s+–\s+\S+$/, ""))})" aria-label="Copier le n° de licence">N°</button>`;
}
/* Infobulle : rôle, nom et n° de licence retrouvé, même si le nom a été tapé sans licence */
function titreOff(l, v){
  if (!v) return l;
  const r = licDe(v);
  return r && r[1]?.licence && !String(v).includes(r[1].licence) ? `${l} : ${v} – licence ${r[1].licence}` : `${l} : ${v}`;
}
const boutonsOff = (v, col) => cleBtn(v) + (estLicCol(col) ? licBtn(v) : "");
function majCleBtn(input){
  const col = colsOff().find(c => "o_" + c.k === input.id);
  const html = boutonsOff(input.value, col), wrap = input.parentElement?.classList.contains("avec-cle") ? input.parentElement : null;
  if (wrap){ wrap.querySelectorAll(".cle-btn").forEach(b => b.remove()); if (html) input.insertAdjacentHTML("afterend", html); }
  else if (html) input.insertAdjacentHTML("afterend", html), input.parentElement.classList.add("avec-cle");
}
async function copierCle(id){
  const cle = S.licencies.get(id)?.cle; if (!cle){ toast("Pas de clé enregistrée pour ce licencié."); return; }

async function lireTableur(file){

async function importLicencies(file){
  licLog(`<span class="muted">Lecture du fichier…</span>`);
  const rows = await lireTableur(file);
  let hi = rows.slice(0, 15).findIndex(r => r.some(c => norm(c).includes("licence")) && r.some(c => norm(c).startsWith("nom")));
  if (hi < 0) throw new Error("Colonnes « Nom » et « N° licence » introuvables dans le fichier.");
  const hd = rows[hi].map(norm), find = f => hd.findIndex(f);
  const ix = { nom:find(x => x === "nom" || x === "nom d usage") >= 0 ? find(x => x === "nom" || x === "nom d usage") : find(x => x.startsWith("nom") && !x.includes("club") && !x.includes("naissance")),
    prenom:find(x => x.startsWith("prenom")), licence:find(x => x.includes("licence") && !x.includes("type") && !x.includes("date") && !x.includes("statut")), cle:find(x => x.startsWith("cle")), categorie:find(x => x.startsWith("categorie")), sexe:find(x => x === "sexe" || x === "genre") };
  if (ix.nom < 0 || ix.licence < 0) throw new Error("Colonnes « Nom » et « N° licence » introuvables dans le fichier.");
  const g = (r, k) => ix[k] >= 0 ? String(r[ix[k]] ?? "").trim() : "";
  const out = [], vus = new Set();
  for (const r of rows.slice(hi + 1)){
    const lic = g(r, "licence").toUpperCase().replace(/\s+/g, ""), nom = g(r, "nom"); if (!lic || !nom) continue;
    const id = "l-" + lic.replace(/[^A-Z0-9]/g, ""); if (vus.has(id)) continue; vus.add(id);
    const old = S.licencies.get(id) || {};
    const d = { ...old, nom, prenom:g(r, "prenom"), licence:lic, categorie:g(r, "categorie"), sexe:g(r, "sexe"), roles:old.roles || [] };
    if (g(r, "cle")) d.cle = g(r, "cle");
    if (JSON.stringify(d) !== JSON.stringify(old)) out.push({ collection:"licencies", id, data:d });
  }
  if (!vus.size) throw new Error("Aucune ligne de licencié reconnue.");
  await writeMany(out, (d, n) => licLog(`<span class="muted num">Enregistrement : ${d}/${n}</span>`));
  let purges = 0;
  if ($("#licPurge")?.checked){ for (const id of [...S.licencies.keys()]) if (!vus.has(id) && id.startsWith("l-")){ try { await remove("licencies", id); purges++; } catch {} } }
  licLog(`<div class="banner" style="background:var(--dom-soft);color:var(--dom)">${vus.size} licencié${vus.size>1?"s":""} lu${vus.size>1?"s":""}, ${out.length} ajouté${out.length>1?"s":""} ou mis à jour${purges ? `, ${purges} retiré${purges>1?"s":""}` : ""}.</div>`);
}

const AC = { input:null, items:[], idx:-1, box:null };
function acMatches(q){
  q = norm(q); if (q.length < 2) return [];

  return [...S.licencies.values()].map(l => ({ l, t:norm(`${l.prenom} ${l.nom} ${l.nom} ${l.licence}`) }))
    .filter(x => mots.every(m => x.t.includes(m)))
    .sort((a, b) => (norm(b.l.nom).startsWith(q) || norm(b.l.prenom).startsWith(q) ? 1 : 0) - (norm(a.l.nom).startsWith(q) || norm(a.l.prenom).startsWith(q) ? 1 : 0) || String(a.l.nom).localeCompare(String(b.l.nom), "fr"))
    .slice(0, 8).map(x => x.l);
}
function acClose(){ AC.box?.remove(); AC.box = null; AC.items = []; AC.idx = -1; }
function acOpen(input){
  AC.input = input; AC.items = acMatches(input.value); AC.idx = -1;
  if (!AC.items.length){ acClose(); return; }
  if (!AC.box){ AC.box = document.createElement("div"); AC.box.className = "ac-box"; AC.box.setAttribute("role", "listbox"); }
  (input.closest("dialog") || document.body).appendChild(AC.box);
  acPlace(); acPaint();
}
function acPaint(){
  if (!AC.box) return;
  AC.box.innerHTML = AC.items.map((l, i) => `<div class="ac-it ${i === AC.idx ? "on" : ""}" data-ac="${i}" role="option"><b>${h(String(l.nom||"").toUpperCase())}</b> ${h(l.prenom||"")}<span class="muted small num"> ${h(l.licence||"")}${l.categorie ? " · " + h(l.categorie) : ""}</span></div>`).join("")
    + `<div class="ac-foot muted small">Entrée sans sélection : garder « ${h(AC.input.value)} »</div>`;
}
function acValider(input, l){
  if (l) input.value = licLabel(l);
  acClose();
  input.dispatchEvent(new Event("change", { bubbles:true }));
}
document.addEventListener("input", e => { if (e.target.dataset?.lic) acOpen(e.target); });
document.addEventListener("keydown", e => {
  const t = e.target; if (!t.dataset?.lic) return;
  if (e.key === "ArrowDown" && AC.items.length){ e.preventDefault(); AC.idx = (AC.idx + 1) % AC.items.length; acPaint(); }
  else if (e.key === "ArrowUp" && AC.items.length){ e.preventDefault(); AC.idx = AC.idx <= 0 ? AC.items.length - 1 : AC.idx - 1; acPaint(); }
  else if (e.key === "Enter"){ e.preventDefault(); acValider(t, AC.idx >= 0 ? AC.items[AC.idx] : null); }
  else if (e.key === "Escape" && AC.box){ e.preventDefault(); e.stopPropagation(); acClose(); }
}, true);
document.addEventListener("mousedown", e => { const it = e.target.closest?.(".ac-it"); if (it && AC.input){ e.preventDefault(); acValider(AC.input, AC.items[+it.dataset.ac]); } });
document.addEventListener("focusout", e => { if (e.target.dataset?.lic) setTimeout(() => { if (document.activeElement !== AC.input) acClose(); }, 120); });
function acPlace(){
  if (!AC.box || !AC.input) return;
  const r = AC.input.getBoundingClientRect(), w = Math.max(r.width, 280);
  AC.box.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px"; AC.box.style.width = w + "px";
  const below = innerHeight - r.bottom > 260; AC.box.style.top = below ? (r.bottom + 2) + "px" : ""; AC.box.style.bottom = below ? "" : (innerHeight - r.top + 2) + "px";
}
window.addEventListener("scroll", e => { if (!AC.box || AC.box.contains(e.target)) return; if (document.activeElement === AC.input && AC.input.isConnected) acPlace(); else acClose(); }, true);
window.addEventListener("resize", () => acPlace());

async function importFFBB(json){
  if (!json || !Array.isArray(json.matchs)) throw new Error("Ce fichier ne vient pas de l'import FFBB (liste « matchs » absente).");
  const st = { nouveaux:0, maj:0, figes:0, remplaces:[], logos:0 };
  const nomsImport = new Map((json.equipes || []).map(e => ["e-" + e.ffbbId, e.nom]));
  const rows = [], put = (collection, id, data, old) => { if (!old || JSON.stringify(old) !== JSON.stringify(data)) rows.push({ collection, id, data }); };
  const remplacer = !!$("#ffbbLogosMaj")?.checked, peutRemplacer = o => !o?.logo || (remplacer && o.logoSource !== "manuel");
  const logo = async uri => { if (!uri) return null; if (S.demo) return uri; try { const n = await uploadDataUri(uri); st.logos++; return n; } catch { return null; } };
  if (json.clubsCtc?.length){
    const l = json.clubsCtc.map(c => ({ ffbbId:String(c.ffbbId), nom:c.nom || "", principal:!!c.principal }));
    if (JSON.stringify(l) !== JSON.stringify(S.reglages.ffbbClubs || [])) await saveReglages({ ffbbClubs:l });
  }
  if (json.club){
    const patch = {}; if (!S.reglages.nom && json.club.nom) patch.nom = json.club.nom; if (json.club.ffbbId) patch.ffbbId = String(json.club.ffbbId);
    if (peutRemplacer(S.reglages) && json.club.logo){ const n = await logo(json.club.logo); if (n){ patch.logo = n; patch.logoSource = "ffbb"; } }
    if (Object.keys(patch).some(k => S.reglages[k] !== patch[k])) put("reglages", "club", { ...S.reglages, ...patch }, null);
  }
  const clubs = json.clubs || []; let ci = 0;
  for (const c of clubs){
    ci++; if (!c.ffbbId) continue; const id = "c-" + c.ffbbId, old = S.clubs.get(id);
    const d = { ...(old||{}), ffbbId:String(c.ffbbId), nom:old?.nomManuel ? old.nom : (c.nom || old?.nom || ""), ville:old?.ville || c.ville || "" };
    if (peutRemplacer(old) && c.logo){ log(`<span class="muted num">Logos : ${ci}/${clubs.length}</span>`); const n = await logo(c.logo); if (n){ d.logo = n; d.logoSource = "ffbb"; } }
    put("clubs", id, d, old);
  }
  for (const s of json.salles || []){
    if (!s.ffbbId) continue; const id = "s-" + s.ffbbId, old = S.salles.get(id);
    put("salles", id, { ...(old||{}), ffbbId:String(s.ffbbId), nom:old?.nom || s.nom || "", adresse:old?.adresse || s.adresse || "", ville:old?.ville || s.ville || "", nous:old?.nous ?? !!s.nous }, old);
  }
  let ne = 0; const remap = new Map(), aSupprimer = [];
  for (const e of json.equipes || []){
    if (!e.ffbbId) continue; const id = "e-" + e.ffbbId; let old = S.equipes.get(id);
    // Anciennes équipes créées par phase (une par inscription FFBB) : on les fusionne dans celle-ci
    const anciens = (e.engagements || []).map(x => "e-" + x).filter(x => x !== id && S.equipes.has(x));
    if (anciens.length){
      const src = anciens.map(x => S.equipes.get(x)), base = src.find(x => x.visible !== false) || src[0];
      const garde = {}; for (const k of ["coach","couleur","duree","ordre"]) { const v = src.map(x => x[k]).find(v => v !== undefined && v !== ""); if (v !== undefined) garde[k] = v; }
      if (base.nomManuel){ garde.nom = base.nom; garde.nomManuel = true; }
      garde.visible = src.some(x => x.visible !== false);
      old = { ...(old || {}), ...garde };
      for (const x of anciens){ remap.set(x, id); aSupprimer.push(x); }
      S.equipes.set(id, old);
    }
    const d = { ...(old||{}), ffbbId:String(e.ffbbId), ffbbNom:e.nom, nom:old?.nomManuel ? old.nom : (e.nom || old?.nom || ""), categorie:old?.categorie || e.categorie || "", competition:e.competition || old?.competition || "" };
    if (e.clubFfbbId != null){ d.clubId = e.principal === false ? "c-" + e.clubFfbbId : ""; d.clubNom = e.principal === false ? (e.clubNom || "") : ""; }
    if (old?.visible === undefined) d.visible = e.principal !== false;
    if (!old) d.couleur = ["#c2410c","#1d4ed8","#15803d","#7e22ce","#b45309","#0e7490","#be123c","#4d7c0f"][(S.equipes.size + ne++) % 8];
    put("equipes", id, d, old);
  }
  for (const r of json.matchs){
    if (!r.ffbbId) continue; const id = "m-" + r.ffbbId, old = S.matchs.get(id);
    const inc = { date:r.date || "", heure:r.heure || "", domicile:!!r.domicile, equipeId:r.equipeFfbbId ? "e-" + r.equipeFfbbId : (old?.equipeId || ""),
      adversaireClubId:r.adversaireFfbbId ? "c-" + r.adversaireFfbbId : "", adversaireNom:r.adversaire || "", salleId:r.salleFfbbId ? "s-" + r.salleFfbbId : "", salleNom:r.salle || "",
      competition:r.competition || "", journee:r.journee != null ? String(r.journee) : "", scoreNous:r.scoreNous ?? "", scoreEux:r.scoreEux ?? "",
      statut:r.statut || (r.joue ? "joue" : "prevu") };
    if (remap.has(inc.equipeId)) inc.equipeId = remap.get(inc.equipeId);
    const figes = new Set(old?.figes || []);
    const d = { ...(old || { source:"ffbb" }), ffbbNumero:r.numero || old?.ffbbNumero || "", ffbb:{ ...inc } };
    delete d.verrous;   // anciens verrous automatiques (v1.0-1.4) : abandonnés, la FFBB fait foi
    if (old){
      const avant = { ...old, ffbb:old.ffbb || inc };   // valeurs saisies à la main = écart avec la dernière valeur FFBB connue
      const manuels = old.ffbb ? ecarts(avant) : FFBB_GROUPES.filter(([, fs]) => (old.verrous || []).some(f => fs.includes(f))).map(([g, fs, l]) => ({ g, fs, l }));
      for (const e of manuels){
        if (figes.has(e.g)){ st.figes++; continue; }
        if (e.fs.some(f => sv(old[f]) !== sv(inc[f]))) st.remplaces.push(`${equipe(inc.equipeId)?.nom || nomsImport.get(inc.equipeId) || nomEquipe(old)} (${old.date ? dayLabel(old.date) : "?"}) : ${e.l.toLowerCase()} ${fmtFfbb(e.g, old)} → ${fmtFfbb(e.g, inc)}`);
      }
    }
    for (const [g, fs] of FFBB_GROUPES) for (const f of fs){ if (old && figes.has(g)) continue; d[f] = inc[f]; }
    if (!old){ st.nouveaux++; d.maj = new Date().toISOString(); rows.push({ collection:"matchs", id, data:d }); }
    else if (FFBB_FIELDS.some(f => sv(old[f]) !== sv(d[f])) || JSON.stringify(old.ffbb || null) !== JSON.stringify(d.ffbb) || old.verrous){ st.maj++; d.maj = new Date().toISOString(); rows.push({ collection:"matchs", id, data:d }); }
  }
  // Matchs restants (saisis à la main, ou hors import) rattachés à une ancienne équipe par phase
  const touches = new Set(rows.filter(r => r.collection === "matchs").map(r => r.id));
  for (const [id, m] of S.matchs) if (!touches.has(id) && remap.has(m.equipeId)) rows.push({ collection:"matchs", id, data:{ ...m, equipeId:remap.get(m.equipeId) } });
  log(`<span class="muted">Enregistrement dans la base…</span>`);
  await writeMany(rows, (d, n) => log(`<span class="muted num">Enregistrement : ${d}/${n}</span>`));
  for (const x of aSupprimer){ try { await remove("equipes", x); } catch {} }

function parseCSV(txt){
  txt = txt.replace(/^﻿/, ""); const first = txt.split(/\r?\n/)[0] || ""; const sep = (first.match(/;/g)||[]).length >= (first.match(/,/g)||[]).length ? ";" : ",";
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < txt.length; i++){ const c = txt[i];
    if (q){ if (c === '"' && txt[i+1] === '"'){ cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true; else if (c === sep){ row.push(cur); cur = ""; } else if (c === "\n" || c === "\r"){ if (c === "\r" && txt[i+1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; } else cur += c; }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
async function importCSV(txt){

/* ============ Version navigateur / téléphone (PWA) : accès direct à Supabase ============
   L'application PC passe par Python (window.pywebview.api) ; dans un navigateur, cet objet offre les mêmes

const WEB = location.protocol === "https:" || /[?&]web=1\b/.test(location.search);
const VERSION_WEB = "1.15.1";
function creerApiWeb(){
  const ls = { get(k){ try { return localStorage.getItem("fb:" + k); } catch { return null; } },
               set(k, v){ try { v == null ? localStorage.removeItem("fb:" + k) : localStorage.setItem("fb:" + k, v); } catch {} } };
  let base = "", key = "", jeton = null, refresh = null, expire = 0, user = null;
  const OFF = { ok:false, offline:true, error:"Pas de connexion internet." };
  const KO = async r => { let m = r.statusText || ("Erreur " + r.status); try { const j = await r.json(); m = j.error_description || j.msg || j.message || j.error || m; } catch {} return { ok:false, error:String(m), status:r.status }; };
  const entetes = (auth, extra) => { const h = { apikey:key, "Content-Type":"application/json", ...(extra || {}) };
    if (auth && jeton) h.Authorization = "Bearer " + jeton; else if (key.startsWith("eyJ")) h.Authorization = "Bearer " + key; return h; };
  function poser(j){ jeton = j.access_token; refresh = j.refresh_token || refresh; expire = Date.now() + (j.expires_in || 3600) * 1000; user = j.user || user; if (ls.get("refresh")) ls.set("refresh", refresh); }

    let r; try { r = await fetch(base + "/auth/v1/token?grant_type=refresh_token", { method:"POST", headers:entetes(false), body:JSON.stringify({ refresh_token:t }) }); } catch { return OFF; }
    if (!r.ok){ jeton = refresh = null; return await KO(r); }
    poser(await r.json()); return { ok:true };
  }
  /* requête authentifiée : renvoie { r } ou une réponse d'erreur { ok:false, … } */
  async function http(chemin, opt = {}){
    if (refresh && Date.now() > expire - 60000){ const x = await rafraichir(); if (!x.ok) return x; }
    try { return { r: await fetch(base + chemin, { ...opt, headers:entetes(true, opt.headers) }) }; } catch { return OFF; }
  }
  async function json(chemin, opt){ const x = await http(chemin, opt); if (!x.r) return x; if (!x.r.ok) return await KO(x.r); const t = await x.r.text(); return { ok:true, data:t ? JSON.parse(t) : null }; }
  async function role(){
    if (!user?.id) return "lecteur";
    const x = await json(`/rest/v1/membres?select=role&user_id=eq.${encodeURIComponent(user.id)}`);
    return x.ok && x.data?.[0]?.role || "lecteur";
  }
  async function session(memoriser){

    return { ok:true, email:user?.email || "", role:await role(), logoBase:base + "/storage/v1/object/public/logos/" };
  }
  function fichier(nom, contenu, b64){
    let blob;
    if (contenu instanceof Blob) blob = contenu;
    else if (b64){ const s = atob(String(contenu).split(",").pop()), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
      const mime = (/^data:([^;,]+)/.exec(contenu) || [])[1] || (nom.endsWith(".png") ? "image/png" : nom.endsWith(".pdf") ? "application/pdf" : "application/octet-stream"); blob = new Blob([a], { type:mime }); }
    else blob = new Blob([contenu], { type:nom.endsWith(".csv") ? "text/csv" : nom.endsWith(".json") ? "application/json" : "text/plain" });
    return new File([blob], nom, { type:blob.type });
  }
  const api = {
    async init(){
      base = ls.get("base") || ""; key = ls.get("key") || "";
      if (!base || !key){ try { const c = await (await fetch("../config.json", { cache:"no-cache" })).json(); if (c.ref) base = `https://${c.ref}.supabase.co`; key = c.key || ""; } catch {} }
    },
    async get_config(){ return { ok:true, url:base, key, email:ls.get("email") || "", remember:!!ls.get("refresh"), configured:!!(base && key), logoBase:base ? base + "/storage/v1/object/public/logos/" : "", version:VERSION_WEB + " (web)", web:true }; },
    async set_config(url, k){ url = String(url || "").trim().replace(/\/+$/, ""); k = String(k || "").trim();
      if (!/^https:\/\//.test(url) || !k) return { ok:false, error:"Adresse (https://…supabase.co) et clé publique obligatoires." };
      base = url; key = k; ls.set("base", url); ls.set("key", k); ls.set("refresh", null); ls.set("cache", null); return { ok:true, logoBase:base + "/storage/v1/object/public/logos/" }; },
    async login(email, pw, memoriser = true){
      let r; try { r = await fetch(base + "/auth/v1/token?grant_type=password", { method:"POST", headers:entetes(false), body:JSON.stringify({ email:String(email).trim(), password:pw }) }); } catch { return OFF; }
      if (!r.ok) return await KO(r); poser(await r.json()); return await session(memoriser);
    },
    async resume(){ const t = ls.get("refresh"); if (!t || !base) return { ok:true, resumed:false };
      const x = await rafraichir(t); if (x.offline) return x; if (!x.ok){ ls.set("refresh", null); return { ok:true, resumed:false }; }
      return { ...(await session(true)), resumed:true }; },
    async logout(){ try { if (jeton) await fetch(base + "/auth/v1/logout", { method:"POST", headers:entetes(true) }); } catch {} jeton = refresh = null; user = null; ls.set("refresh", null); return { ok:true }; },
    async change_password(pw){ if (String(pw || "").length < 8) return { ok:false, error:"8 caractères minimum." }; const x = await json("/auth/v1/user", { method:"PUT", body:JSON.stringify({ password:pw }) }); return x.ok ? { ok:true } : x; },
    async fetch(since){

        const q = new URLSearchParams({ select:"collection,id,data,deleted,updated_at", order:"updated_at.asc,collection.asc,id.asc", limit:"1000", offset:String(offset) });

    async upsert(lignes){

      return { ok:true };
    },
    async merge(c, id, patch){ const x = await json("/rest/v1/rpc/fusionner_document", { method:"POST", body:JSON.stringify({ p_collection:c, p_id:id, p_patch:patch }) }); return x.ok ? { ok:true } : x; },
    async delete(c, id){ const x = await json(`/rest/v1/documents?collection=eq.${encodeURIComponent(c)}&id=eq.${encodeURIComponent(id)}`, { method:"PATCH", headers:{ Prefer:"return=minimal" }, body:JSON.stringify({ deleted:true, data:{} }) }); return x.ok ? { ok:true } : x; },
    async upload_logo(uri, mime){

    },
    async partages(){ const x = await json("/rest/v1/partages?select=*&order=cree_le.desc"); return x.ok ? { ok:true, liens:x.data } : x; },
    async partage_creer(row){ const ok = {}; for (const k of ["token","titre","equipes","matchs","champs","expire_le"]) if (k in row) ok[k] = row[k];
      const x = await json("/rest/v1/partages", { method:"POST", headers:{ Prefer:"return=representation" }, body:JSON.stringify(ok) }); return x.ok ? { ok:true, lien:x.data?.[0] } : x; },
    async partage_revoquer(t){ const x = await json(`/rest/v1/partages?token=eq.${encodeURIComponent(t)}`, { method:"PATCH", headers:{ Prefer:"return=minimal" }, body:JSON.stringify({ actif:false }) }); return x.ok ? { ok:true } : x; },
    async ouvrir_url(u){ if (!/^(https:|whatsapp:)/.test(u)) return { ok:false, error:"Adresse refusée." }; window.open(u, "_blank", "noopener"); return { ok:true }; },
    async cache_save(t){ ls.set("cache", t); return { ok:true }; },
    async cache_load(){ return { ok:true, text:ls.get("cache") || "" }; },
    async cache_clear(){ ls.set("cache", null); return { ok:true }; },
    /* fichiers : partage du téléphone si possible (WhatsApp, Drive…), sinon téléchargement */
    async save_file(nom, contenu, b64){

      try { if (navigator.canShare?.({ files:[f] })){ await navigator.share({ files:[f], title:nom }); return { ok:true, saved:true, path:nom }; } }
      catch (e){ if (e?.name === "AbortError") return { ok:true, saved:false }; }
      const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = nom; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
      return { ok:true, saved:true, path:nom };
    },
    async lire_tableur(){ return { ok:false, error:"Les fichiers Excel s'importent depuis l'application PC. Sur téléphone, enregistrez-les d'abord en CSV." }; },
    async ffbb_search(){ return { ok:false, error:"L'import FFBB se fait depuis l'application PC." }; },
    async ffbb_export(){ return { ok:false, error:"L'import FFBB se fait depuis l'application PC." }; },
    async pdf_officiels(){ return { ok:false, error:"web" }; },
  };
  return api;
}

/* Impression (version web) : la feuille des officiels s'imprime ou s'enregistre en PDF depuis le navigateur */
function imprimerOfficiels(d){
  let z = document.getElementById("printZone"); if (!z){ z = document.createElement("div"); z.id = "printZone"; document.body.appendChild(z); }
  const logo = S.reglages.logo ? logoURL(S.reglages.logo) : "logo-club.png";
  z.innerHTML = d.jours.map(j => `<section class="pz-page"><header><img src="${h(logo)}" alt=""><div><small>${h(d.club.toUpperCase())}</small><h1>${h(d.titre)} · ${h(j.label)}</h1><p>${j.matchs.length} match${j.matchs.length > 1 ? "s" : ""} à domicile · ${h(d.sousTitre || "")}</p></div></header>
    <table><thead><tr><th>Heure</th><th>Match</th>${d.colonnes.map(c => `<th>${h(c.titre)}</th>`).join("")}</tr></thead><tbody>
    ${j.matchs.map(m => `<tr><td class="pz-h">${h(m.heure)}</td><td>${h(m.equipe)}<br>reçoit ${h(m.adversaire)}${m.salle ? `<br><span class="pz-m">${h(m.salle)}</span>` : ""}</td>
      ${m.roles.map(cel => `<td>${cel.map(v => v.valeur ? h(v.valeur) : v.requis ? `<span class="pz-a">${cel.length > 1 ? h(v.libelle) + " : " : ""}à pourvoir</span>` : "—").join("<br>")}</td>`).join("")}</tr>`).join("")}
    </tbody></table><footer>${h(d.club)} · édité le ${new Date().toLocaleString("fr-FR", { dateStyle:"short", timeStyle:"short" })}</footer></section>`).join("");
  document.body.classList.add("impression");
  const fin = () => { document.body.classList.remove("impression"); window.removeEventListener("afterprint", fin); };
  window.addEventListener("afterprint", fin);
  setTimeout(() => { window.print(); setTimeout(fin, 1500); }, 300);
}

/* ============ Démarrage ============ */
async function boot(){
  applyTheme();
  if (WEB){ api = creerApiWeb(); await api.init(); enregistrerPWA(); }
  else { if (!window.pywebview?.api){ dbState = "setup"; CFG = {}; render(); return; }   // ouverture hors application
    api = window.pywebview.api; }
  const c = await api.get_config(); CFG = c.ok ? c : {}; logoBase = CFG.logoBase || "";
  if (!CFG.configured){ dbState = "setup"; render(); return; }
  if (CFG.remember){ dbState = "loading"; render(); const r = await api.resume();
    if (r.ok && r.resumed){ await afterLogin(r); return; }
    if (r.offline){ if (await demarrerHorsLigne()) return; dbState = "login"; render(); toast("Pas de connexion internet, et aucune donnée enregistrée sur ce PC."); return; } }
  dbState = "login"; render();
}
let booted = false;
const start = () => { if (booted) return; booted = true; boot(); };
window.addEventListener("pywebviewready", start);
if (WEB) start();
function enregistrerPWA(){
  document.body.classList.add("web");
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
setTimeout(() => { if (!booted && window.pywebview?.api) start(); }, 400);
setTimeout(() => { if (!booted) start(); }, 2500);
</script>
